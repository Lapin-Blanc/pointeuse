{% extends "pointages/base.html" %}
{% block titre %}Mot de passe{% endblock %}
{% block contenu %}
<h1>Changer mon mot de passe</h1>
<div class="carte" style="max-width: 460px">
  <form method="post" novalidate>{% csrf_token %}
    {% for f in form %}<div class="champ" style="margin-bottom:12px"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
    <button class="bouton">Enregistrer</button>
  </form>
</div>
{% endblock %}
