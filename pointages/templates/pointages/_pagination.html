{% if page.has_other_pages %}
<div class="pagination">
  {% if page.has_previous %}<a class="bouton petit secondaire" href="?{% if params %}{{ params }}&{% endif %}page={{ page.previous_page_number }}">← Précédent</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="bouton petit secondaire" href="?{% if params %}{{ params }}&{% endif %}page={{ page.next_page_number }}">Suivant →</a>{% endif %}
</div>
{% endif %}
